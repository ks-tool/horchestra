# horchestra manifest: Secrets and the Applications that consume them.
#
#   kubectl --kubeconfig pki/admin.conf apply -f examples/secret.yaml
#
# A secret reaches a workload two ways, and neither ever puts the value in the API object or in
# the unit's own Environment= (which systemd exports as a bus property any local caller can read):
#
#   * a volume mount — per-key files projected at the path you choose, materialized in RAM by
#     PID1 (a systemd service credential) with a restrictive mode before the value is ever in it;
#   * spec.env with a secretRef — the resolved assignments become REAL PROCESS ENVIRONMENT at
#     execve, Kubernetes-style: nothing to source, the variable is simply there. The node writes
#     them to a RAM-backed carrier file (tmpfs, 0600) that the systemd runtime hands to PID1 via
#     EnvironmentFile= and the rootless runtime folds into the sandbox's envp — only the file's
#     PATH is ever written down. Such a workload's unit requires the agent's and never starts
#     without the process that holds the values. The usual env caveats apply: the values are
#     visible in the workload's own /proc/self/environ and inherited by its children — mount them
#     instead where that is unacceptable.
#
# WHERE the value comes from is a separate axis (the last two documents): type Opaque carries it
# inline in the object, type horchestra.io/vault carries only a reference and the NODE fetches the
# value straight from Vault/OpenBao — the control plane never sees it. Both shapes above work with
# either source.
#
# Only the nodes running an app that consumes it receive a Secret at all — a node never sees a
# credential no workload of its uses, whichever shape it is consumed through.
#
# Data keys must be bare file names: no '/', no '.' or '..', and none of the characters the
# node refuses in a container path (whitespace, ':', '\', control characters). The API edge
# applies exactly the validator the node applies, so a key that would fail to project is
# rejected here rather than stalling every app in the namespace that mounts the secret.
apiVersion: horchestra.io/v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: default
type: Opaque # the default: the value is carried inline, in this object
# Immutable forbids any later change to data (metadata may still change), and the flag itself
# cannot be cleared — otherwise clearing it in one write and changing the value in the next
# would defeat exactly the guarantee it exists to give. Rotate by creating a new Secret.
immutable: true
# stringData is a write-only convenience: admission folds it into data (base64) and clears it,
# so a stored Secret only ever carries data. Use data directly for binary values.
stringData:
  password: s3cr3t-demo-value
  # A second key, projected below at a different path to show the remapping.
  ca.pem: |
    -----BEGIN CERTIFICATE-----
    (a demo value; not a real certificate)
    -----END CERTIFICATE-----
---
# The same PostgreSQL as postgres.yaml, taking its password from the mounted file instead of
# trusting every connection. POSTGRES_PASSWORD_FILE is postgres' own file-based convention —
# the env var names a PATH, which is not a secret. See the third document for the secretRef
# shape, which suits a program that reads a variable rather than a file.
apiVersion: horchestra.io/v1
kind: Application
metadata:
  name: postgres-18-auth
  namespace: default
spec:
  image: docker.io/library/postgres:18-alpine
  lifecycle:
    restartPolicy: Always
  env:
    - name: POSTGRES_PASSWORD_FILE
      value: /etc/postgres/password
    - name: PGDATA
      value: /var/lib/postgresql/data
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  volumes:
    - volume:
        type: secret
        name: postgres-credentials # required for a secret mount (a nameless one is refused)
        # items selects and remaps keys; without it every key projects at its own name.
        items:
          - key: password
            path: password
            mode: 0400
          # a relative path may nest, but never escape
          - key: ca.pem
            path: tls/ca.pem
        defaultMode: 0400 # applies to any item without its own mode
        # optional: false is the default and it is FAIL-CLOSED — a missing Secret holds the
        # app rather than starting it without its credential. An already-running app keeps
        # running (keep-last-good) instead of being torn down.
      mountPath: /etc/postgres
    - volume:
        type: pv
        name: pg-auth-data
        size: 10Gi
      mountPath: /var/lib/postgresql
    - volume:
        type: tmpfs
        size: 64Mi
      mountPath: /run/postgresql
---
# A client that only knows environment variables. The node resolves each secretRef and the value
# arrives as ordinary process environment — no file to source, nothing in the Application object
# and nothing in the unit text. The values never touch persistent disk, so a rotated-away
# credential cannot be recovered from the node, and the unit requires the agent's own, so it
# never starts without the process that holds them. A rotated Secret restarts the workload.
apiVersion: horchestra.io/v1
kind: Application
metadata:
  name: psql-client
  namespace: default
spec:
  image: docker.io/library/postgres:18-alpine
  lifecycle:
    restartPolicy: OnFailure
  command:
    - /bin/sh
    - "-c"
    - "psql -h $PG_host -U $PG_username -c 'select 1'"
  env:
    # One key under a name of your choosing.
    - name: PGPASSWORD
      secretRef:
        name: postgres-credentials
        key: password
    # Every key of the secret, one variable per key, named PG_<key> in sorted key order. The
    # wildcard entry carries no name — the names come from the keys — and any key that is not a
    # valid variable name (this secret's "ca.pem" would be one) fails the converge naming it, so
    # keep file-shaped keys in a separate Secret you mount.
    - secretRef:
        name: db-connection
        key: "*"
        prefix: PG_
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
---
apiVersion: horchestra.io/v1
kind: Secret
metadata:
  name: db-connection
  namespace: default
stringData:
  host: postgres-18-auth
  username: postgres
---
# A SecretStore: WHERE an external Vault/OpenBao lives and HOW a node authenticates to it. It
# holds connection information only — no value ever rests in it, so a control-plane compromise
# leaks addresses and paths, never credentials. See docs/vault-integration.md for the three
# setups (node certificate, kubernetes auth, Vault as the cluster PKI).
apiVersion: secrets.horchestra.io/v1
kind: SecretStore
metadata:
  name: corp-vault
  namespace: default
spec:
  provider: openbao # or vault — documents intent; the two speak one API, so one client serves both
  server: https://vault.example:8200
  mount: secret # the KV engine mount (default "secret")
  kvVersion: 2 # 1 or 2 (default 2)
  # caBundle verifies the SERVER's TLS certificate (base64 PEM); omitted here, which falls back
  # to the system roots.
  auth:
    # The controller mints a short-lived per-workload identity token — shaped like a Kubernetes
    # projected service-account token — and pushes it beside desired state for exactly the apps
    # scheduled on this node. Vault's stock kubernetes method validates it LIVE against the
    # controller's TokenReview endpoint, so the role below binds a plain service-account name and
    # namespace. The alternative is method: cert, which reuses the node's own client certificate.
    method: kubernetes
    role: horchestra-workloads
---
# A vault-sourced Secret: the object carries a REFERENCE, never a value. The node fetches it
# directly from the store — the control plane is out of the value path entirely — and materializes
# it exactly like an inline one (files in RAM, or process environment). Admission refuses inline
# data on this type: a second copy is one the store would never rotate.
apiVersion: horchestra.io/v1
kind: Secret
metadata:
  name: db-creds-external
  namespace: default
  annotations:
    secrets.horchestra.io/store: corp-vault
    secrets.horchestra.io/path: prod/db # LOGICAL path — the client inserts /data/ for KV v2 itself
    secrets.horchestra.io/keys: "username,password" # optional projection; omit for every key
type: horchestra.io/vault
---
# A DATABASE STATIC ROLE instead of a KV path. Vault owns one fixed database user and rotates its
# password on its own schedule (rotation_period on the role); this Secret names the role, and the
# node reads whatever password Vault currently holds for it. The projected keys are Vault's own,
# username and password.
#
# There is NO LEASE and nothing to renew — that is the point of this shape rather than a fully
# dynamic credential: nothing on the node has to stay alive to keep the credential alive, so an
# agent restart costs one re-read and never a workload's access. What it does not give is a
# per-consumer identity: every workload reading the role gets the same database user.
#
# GATED: the controller must run with --feature-gates=VaultStaticRoles=true, or this annotation is
# refused (403). It is opt-in because the value CHANGES under a running workload, and only a
# volume mount survives that — see the app below.
apiVersion: horchestra.io/v1
kind: Secret
metadata:
  name: db-creds-rotating
  namespace: default
  annotations:
    secrets.horchestra.io/store: corp-vault
    secrets.horchestra.io/static-role: database/app-rw # <mount>/<role>, mutually exclusive with path
type: horchestra.io/vault
---
# Mount a rotating credential, never env it. The volume is the agent's RAM carrier bound into the
# workload, so a re-read lands live under the running process — no restart, and the node re-reads
# just after Vault rotates (it times the refresh off the ttl Vault reports). An env secretRef is
# spawn-time state: the new password would only arrive on the next restart, which is exactly the
# trade this shape exists to avoid. The application has to re-read the file, or reconnect — a
# client that read it once at startup gains nothing from the rotation.
apiVersion: horchestra.io/v1
kind: Application
metadata:
  name: rotating-client
  namespace: default
spec:
  image: docker.io/library/postgres:18-alpine
  command:
    - /bin/sh
    - "-c"
    - "while :; do PGPASSWORD=$(cat /creds/password) psql -h db.internal -U $(cat /creds/username) -c 'select 1'; sleep 30; done"
  volumes:
    - volume:
        name: db-creds-rotating
        type: secret
      mountPath: /creds
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
---
# Consuming the vault secret is identical to consuming an inline one — the source is invisible to
# the workload. Fail-closed on the first materialization (an unreachable Vault holds the app
# Pending rather than starting it without credentials), keep-last-good afterwards, and the fetched
# value is cached briefly, so a rotation in Vault reaches the workload as a restart.
apiVersion: horchestra.io/v1
kind: Application
metadata:
  name: reporting-job
  namespace: default
spec:
  image: docker.io/library/postgres:18-alpine
  lifecycle:
    restartPolicy: OnFailure
  command:
    - /bin/sh
    - "-c"
    - "psql -h db.internal -U $DB_USERNAME -c 'select 1'"
  env:
    - name: DB_PASSWORD
      secretRef:
        name: db-creds-external
        key: password
    - name: DB_USERNAME
      secretRef:
        name: db-creds-external
        key: username
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
