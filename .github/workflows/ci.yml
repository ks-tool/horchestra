# CI for horchestra: six modules — api, controller, agent, netd, sandbox and the root composition —
# plus hack/, which stands apart.
#
# NO WORKSPACE. The modules are published and resolve one another from the proxy, and that is the
# thing worth testing: a workspace would redirect them at this checkout, hide every stale
# requirement, and test something no consumer ever gets. What it costs is that a commit touching two
# modules is gated against the sibling's last PUBLISHED tag — so a change to api reaches controller
# only once api is tagged, and CI says so by failing until it is.
#
# Everything runs on ubuntu, and not for convenience: half this tree is behind //go:build linux
# (systemd, D-Bus, overlayfs, user namespaces, netlink, BPF, seccomp) and carries no portability
# stub, so a darwin host can only type-check it. On a linux runner those tests RUN — which the make
# targets decide by GOHOSTOS rather than by being told.
name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No silent toolchain download. The Go version comes from the tree (below), and `local` makes a
  # tree asking for one the runner does not have fail and say so — the previous workflow named
  # 1.26.4 while every module pinned 1.26.5, and nothing ever reported the difference.
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint (gofmt + vet + tidy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # From the root module's `go` directive rather than a literal: a version written here is
          # a second place to update, and the one that gets forgotten.
          go-version-file: go.mod
          # Every module's sums, by glob — a module added later must not be able to miss the cache
          # key by not being listed.
          cache-dependency-path: "**/go.sum"

      # Each module must declare and hash the siblings it imports — which is what a checkout gets,
      # and what a workspace hides: under one those requirements are unnecessary and go stale
      # unnoticed, which is how a checkout of the published modules came to fail with `missing
      # go.sum entry for .../api` on a tree whose own CI was green.
      - name: Every module resolves on its own
        run: |
          for m in . api controller agent netd sandbox hack; do
            echo "== $m"
            (cd "$m" && go mod tidy -diff)
          done

      # gofmt over the whole tree + go vet per module (the linux-only three cross-vetted).
      - name: make lint
        run: make lint

  test:
    name: Test & build (linux, whole tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      # `make test` = api, controller (-race), root + netd, hack, and — because GOHOSTOS is linux
      # here — agent and sandbox for real rather than type-checked. That last pair is the whole
      # point of running CI on ubuntu: the workload sandbox and the node agent are the code with
      # the least margin for a regression and the only code no darwin host can execute.
      - name: make test
        run: make test

      # Build what is actually shipped, through the same target a release uses: three binaries, with
      # GOEXPERIMENT=jsonv2 and CGO_ENABLED=0, linked rather than merely compiled. `go build ./...`
      # (what stood here before) covered the root module's packages and nothing else.
      - name: make all
        run: make all
